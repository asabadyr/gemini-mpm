[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agy-mpm-kit"
version = "2.3.1"
description = "Portable multi-agent rule, skill, and safety guard kit for Google Antigravity"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
